name: cpft
description: A new Flutter project.
publish_to: 'none'
version: 0.1.2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  shelf: ^1.4.1
  http: ^1.1.0
  crypto: ^3.0.3
  wakelock_plus: ^1.2.8
  nsd: ^4.0.3  # For Bonjour/mDNS on iOS
  file_picker: ^8.0.2
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  open_filex: ^4.5.0
  share_plus: ^10.0.2
  flutter_foreground_task: ^8.11.0
  mime: ^1.0.5
  intl: ^0.19.0
  network_info_plus: ^6.0.0
  archive: ^4.0.7
  flutter_local_notifications: ^19.5.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.1
  multicast_dns: ^0.3.2+7
  path: ^1.9.0
  package_info_plus: ^8.0.2
  flutter_webrtc: ^1.2.1
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  in_app_update: ^4.2.3
  socket_io_client: ^2.0.3+1
  flutter_file_dialog: ^3.0.2
  showcaseview: ^5.0.1
  flutter_soloud: ^2.0.0
  url_launcher: ^6.3.0
  receive_sharing_intent: ^1.8.1
  desktop_drop: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900