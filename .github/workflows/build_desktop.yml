name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags like v1.1.5
  workflow_dispatch:  # Allow manual trigger from GitHub UI
    inputs:
      version:
        description: 'Version number (e.g. 1.1.5)'
        required: true
        default: '1.1.5'

jobs:
  # ─────────────────────────────────────────────────────────
  # Build Windows .exe (runs on actual Windows runner)
  # ─────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"  # Strip leading 'v'
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create update ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $bundle = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$bundle\*" -DestinationPath "fylooo-windows-update-$version.zip"
          Write-Host "Created fylooo-windows-update-$version.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            fylooo-windows-update-${{ steps.version.outputs.version }}.zip
          retention-days: 30

  # ─────────────────────────────────────────────────────────
  # Build Linux .deb + update ZIP (runs on Ubuntu runner)
  # ─────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            dpkg-dev zip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Linux release
        run: flutter build linux --release

      - name: Run deployment script
        run: |
          chmod +x ./deploy_linux.sh
          ./deploy_linux.sh "${{ steps.version.outputs.version }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            fylooo-${{ steps.version.outputs.version }}-amd64.deb
            fylooo-linux-update-${{ steps.version.outputs.version }}.zip
          retention-days: 30

  # ─────────────────────────────────────────────────────────
  # Create GitHub Release with both artifacts
  # ─────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Get version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: ./release-files/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: ./release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Fylooo v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          body: |
            ## Fylooo v${{ steps.version.outputs.version }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows (installer) | Available below |
            | Windows (portable zip) | Available below |
            | Linux (.deb) | Available below |

            ### Installation
            **Windows**: Download the `.zip`, extract, and run `cpft.exe`
            **Linux**: `sudo dpkg -i fylooo-${{ steps.version.outputs.version }}-amd64.deb`
          files: ./release-files/*
